<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ประวัติวันลอยกระทง – แอนิเมชัน 2D 3 นาที</title>
<style>
:root{--bg:#f4ecd8;--fg:#2b2118;--ac:#b5651d;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14100c;--fg:#f1e6cf;--ac:#e8a24a}}
:root[data-theme="dark"]{--bg:#14100c;--fg:#f1e6cf;--ac:#e8a24a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Sarabun","Noto Sans Thai",Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px}
h1{font-size:1.1rem;margin:4px 0 10px;text-align:center}
#wrap{position:relative;width:100%;max-width:960px;aspect-ratio:16/9;border:4px solid #6b4a24;border-radius:10px;overflow:hidden;background:#000}
svg{position:absolute;inset:0;width:100%;height:100%}
.sc{opacity:0;transition:opacity 1.2s}.sc.on{opacity:1}
#era{position:absolute;top:3%;left:2.5%;background:#f1e2bd;color:#4a2f12;border:2px solid #6b4a24;padding:.25em .8em;border-radius:4px;font-weight:700;font-size:clamp(.8rem,2.4vw,1.5rem);box-shadow:2px 2px 0 #0006}
#cap{position:absolute;left:3%;right:3%;bottom:3%;background:#1a120acc;color:#fff4d8;padding:.6em 1em;border-radius:8px;font-size:clamp(.75rem,2.2vw,1.35rem);line-height:1.5;text-align:center;border:1px solid #e8a24a88}
#intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#0b0a1ecc;color:#fff4d8;text-align:center;padding:16px}
#intro b{font-size:clamp(1.2rem,4vw,2.4rem)}
button{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:.5em 1.2em;cursor:pointer;font-weight:700}
#bar{width:100%;max-width:960px;display:flex;gap:10px;align-items:center;margin-top:10px}
#prog{flex:1;height:8px;background:#8886;border-radius:4px;overflow:hidden}#prog i{display:block;height:100%;width:0;background:var(--ac)}
#tm{font-variant-numeric:tabular-nums;min-width:5.5em;text-align:right}
#note{font-size:.85rem;opacity:.8;margin-top:6px;max-width:960px;text-align:center}
.w{animation:wv 6s linear infinite}.w2{animation-duration:9s;animation-direction:reverse}
@keyframes wv{to{transform:translateX(-200px)}}
.bob{animation:bb 3.2s ease-in-out infinite alternate}
@keyframes bb{from{transform:translate(0,0)}to{transform:translate(14px,5px)}}
.fw{transform-box:fill-box;transform-origin:center;animation:fx 1.8s ease-out forwards}
@keyframes fx{0%{transform:scale(0);opacity:1}100%{transform:scale(1);opacity:0}}
.ln{animation:rise 9s linear forwards}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(-440px);opacity:0}}
.fl{animation:fk .4s infinite alternate}@keyframes fk{to{opacity:.6}}
</style>
</head>
<body>
<h1>ประวัติวันลอยกระทง จากอดีตถึง พ.ศ. 2569</h1>
<div id="wrap">
<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" aria-label="แอนิเมชันประวัติวันลอยกระทง">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop id="g1" offset="0" stop-color="#0b0a2e" style="transition:stop-color 2s"/><stop id="g2" offset="1" stop-color="#3a2a5c" style="transition:stop-color 2s"/></linearGradient>
<filter id="gl"><feGaussianBlur stdDeviation="8"/></filter>
<g id="chedi"><rect x="-42" y="-12" width="84" height="12"/><rect x="-32" y="-24" width="64" height="12"/><path d="M-28 -24Q-28 -85 0 -112Q28 -85 28 -24Z"/><path d="M-4 -110L0 -165L4 -110Z"/></g>
<g id="prang"><path d="M-34 0L-28 -40L-22 -40L-20 -80L-12 -80L-9 -118L0 -170L9 -118L12 -80L20 -80L22 -40L28 -40L34 0Z"/></g>
<g id="kt"><ellipse cx="0" cy="6" rx="24" ry="7" fill="#3f8a3a"/><g fill="#f7b6d0" stroke="#c0457d" stroke-width="1"><ellipse cx="-12" cy="-2" rx="6" ry="12" transform="rotate(-35 -12 6)"/><ellipse cx="12" cy="-2" rx="6" ry="12" transform="rotate(35 12 6)"/><ellipse cx="0" cy="-4" rx="6" ry="14"/></g><rect x="-2" y="-18" width="4" height="14" fill="#fff4c0"/><ellipse class="fl" cx="0" cy="-22" rx="3" ry="6" fill="#ffb02e"/></g>
</defs>
<rect width="960" height="540" fill="url(#sky)"/>
<g id="stars" fill="#fff"></g>
<circle cx="790" cy="105" r="62" fill="#ffe9a0" opacity=".45" filter="url(#gl)"/>
<circle id="moon" cx="790" cy="105" r="42" fill="#fff3c4"/>

<g class="sc" id="s0"><!-- ghat -->
<path d="M0 360L0 250L120 250L120 275L170 275L170 300L220 300L220 325L270 325L270 360Z" fill="#5a3b2a"/>
<path d="M30 250Q70 190 110 250Z" fill="#7a5238"/><rect x="68" y="168" width="4" height="30" fill="#7a5238"/>
<g fill="#ffb02e"><ellipse class="fl" cx="360" cy="395" rx="5" ry="9"/><ellipse class="fl" cx="470" cy="420" rx="5" ry="9"/><ellipse class="fl" cx="600" cy="400" rx="5" ry="9"/><ellipse class="fl" cx="700" cy="430" rx="5" ry="9"/></g>
<g fill="#8a4a1f"><ellipse cx="360" cy="406" rx="12" ry="4"/><ellipse cx="470" cy="431" rx="12" ry="4"/><ellipse cx="600" cy="411" rx="12" ry="4"/><ellipse cx="700" cy="441" rx="12" ry="4"/></g></g>

<g class="sc" id="s1"><!-- sukhothai -->
<use href="#chedi" x="200" y="360" fill="#e9d6a0" transform="scale(1.7) translate(-85 -212)" style="transform-origin:0 0"/>
<use href="#chedi" x="760" y="360" fill="#d9c488" transform="translate(0 0)"/>
<g transform="translate(560 355)"><circle cy="-62" r="14" fill="#e0b98a"/><path d="M-8 -78Q0 -96 10 -78Z" fill="#1a1a1a"/><path d="M-22 0L-10 -48L10 -48L22 0Z" fill="#c0457d"/><path d="M-10 -40L-30 -18" stroke="#e0b98a" stroke-width="6" stroke-linecap="round"/><path d="M10 -40L30 -18" stroke="#e0b98a" stroke-width="6" stroke-linecap="round"/><use href="#kt" y="-8" transform="scale(1.3)"/></g></g>

<g class="sc" id="s2"><!-- footprint -->
<path d="M0 360Q240 190 480 240Q720 190 960 360Z" fill="#35502f"/>
<ellipse cx="480" cy="250" rx="60" ry="26" fill="#ffe9a0" opacity=".9"/><g fill="#fff3c4"><ellipse cx="450" cy="226" rx="6" ry="8"/><ellipse cx="470" cy="220" rx="6" ry="9"/><ellipse cx="490" cy="220" rx="6" ry="9"/><ellipse cx="510" cy="226" rx="6" ry="8"/></g>
<g stroke="#ffe9a0" stroke-width="3" opacity=".6"><path d="M480 200L480 120M420 210L380 140M540 210L580 140"/></g>
<g fill="#ffb02e"><ellipse class="fl" cx="300" cy="300" rx="4" ry="8"/><ellipse class="fl" cx="660" cy="300" rx="4" ry="8"/><ellipse class="fl" cx="400" cy="320" rx="4" ry="8"/><ellipse class="fl" cx="560" cy="320" rx="4" ry="8"/></g></g>

<g class="sc" id="s3"><!-- ayutthaya -->
<use href="#prang" x="0" y="0" fill="#c9a36a" transform="translate(300 360) scale(1.5)"/>
<use href="#prang" fill="#b88f55" transform="translate(150 360)"/>
<use href="#prang" fill="#b88f55" transform="translate(480 360)"/></g>

<g class="sc" id="s4"><!-- rattanakosin -->
<use href="#chedi" fill="#f2c94c" transform="translate(300 360) scale(1.8)"/>
<use href="#chedi" fill="#d9a830" transform="translate(150 360) scale(.9)"/>
<use href="#chedi" fill="#d9a830" transform="translate(500 360) scale(.9)"/>
<g fill="#4a2f12"><path d="M600 440Q690 470 780 440L770 455Q690 480 610 455Z"/><rect x="688" y="395" width="4" height="45"/></g>
<g fill="#ffb02e"><ellipse class="fl" cx="690" cy="388" rx="4" ry="8"/></g></g>

<g class="sc" id="s5"><!-- natural krathong -->
<g transform="translate(480 400) scale(5)"><use href="#kt"/></g>
<g fill="#fff4c0" font-size="22" text-anchor="middle"><text x="200" y="250">ใบตอง</text><text x="760" y="250">ดอกไม้</text><text x="170" y="330">ธูปเทียน</text><text x="790" y="330">กาบกล้วย</text></g></g>

<g class="sc" id="s6"><!-- foam vs natural -->
<g transform="translate(260 380)"><rect x="-70" y="-40" width="140" height="60" rx="8" fill="#f4f4f4"/><path d="M-80 -60L80 40M80 -60L-80 40" stroke="#e03131" stroke-width="12"/></g>
<g transform="translate(700 400) scale(3.2)"><use href="#kt"/></g>
<path d="M610 270l30 36 60-70" stroke="#4cd964" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<g fill="#fff4c0" font-size="24" text-anchor="middle"><text x="260" y="230">โฟม</text><text x="700" y="220">ย่อยสลายได้</text></g></g>

<g class="sc" id="s7"><!-- present -->
<g fill="#1b1537"><rect x="0" y="300" width="70" height="80"/><rect x="80" y="260" width="60" height="120"/><rect x="150" y="320" width="80" height="60"/><rect x="700" y="280" width="70" height="100"/><rect x="780" y="240" width="60" height="140"/><rect x="850" y="310" width="110" height="70"/></g>
<g fill="#ffd36a"><rect x="95" y="280" width="8" height="8"/><rect x="115" y="300" width="8" height="8"/><rect x="795" y="260" width="8" height="8"/><rect x="815" y="290" width="8" height="8"/></g></g>

<g class="sc" id="s8"><!-- finale --></g>

<g id="fwg"></g><g id="lng"></g>
<rect y="360" width="960" height="180" fill="#101a3a"/>
<ellipse cx="790" cy="400" rx="30" ry="46" fill="#fff3c4" opacity=".25"/>
<g fill="none" stroke="#4a6fb5" stroke-width="3" opacity=".6"><g class="w" id="wv1"></g></g>
<g fill="none" stroke="#7aa0e0" stroke-width="2" opacity=".4"><g class="w w2" id="wv2"></g></g>
<g id="kts"></g>
</svg>
<div id="era"></div>
<div id="cap"></div>
<div id="intro"><b>ประวัติวันลอยกระทง</b><span>จากอดีตสู่ พ.ศ. 2569 · แอนิเมชัน 2D · ความยาว 3 นาที</span><button id="go">▶ เริ่มเล่นพร้อมเสียงบรรยายภาษาไทย</button></div>
</div>
<div id="bar"><button id="pp">⏸</button><div id="prog"><i></i></div><span id="tm">0:00 / 3:00</span><button id="mu">🔊</button></div>
<div id="note"></div>
<script>
var D=20,S=[
["ยุคต้นกำเนิด","นานมาแล้ว ผู้คนริมแม่น้ำเชื่อว่าสายน้ำคือชีวิต เมื่อน้ำหลากในเดือนสิบสอง จึงลอยประทีปบูชาและขอขมาพระแม่คงคา",["#150b2e","#5a3a6a"]],
["สมัยสุโขทัย","เมื่อความเชื่อเดินทางมาถึงสุโขทัย เล่าขานกันว่านางนพมาศประดิษฐ์กระทงรูปดอกบัวถวายพระร่วง แม้นักวิชาการเห็นว่าเป็นเรื่องเล่ารุ่นหลัง",["#0b1233","#6b4a7a"]],
["คติทางพุทธศาสนา","ชาวพุทธยังลอยกระทงเพื่อบูชารอยพระพุทธบาทที่ริมแม่น้ำนัมมทา และน้อมรำลึกถึงพระรัตนตรัย ประเพณีจึงมีความหมายลึกซึ้งยิ่งขึ้น",["#071a2e","#2f5a6a"]],
["สมัยอยุธยา","ถึงสมัยอยุธยา งานเฉลิมฉลองยิ่งใหญ่ตระการตา มีโคมไฟ ดอกไม้ไฟ และพระราชพิธีจองเปรียง ผู้คนพายเรือชมแสงไฟกลางลำน้ำ",["#1a0b2e","#7a3a4a"]],
["สมัยรัตนโกสินทร์","เข้าสู่กรุงรัตนโกสินทร์ ประเพณียังสืบต่อมา ราษฎรลอยกระทงกันทั่วไปตามลำน้ำเจ้าพระยา พร้อมกับเสียงเพลงและเสียงหัวเราะ",["#0b1233","#8a5a3a"]],
["กระทงแบบดั้งเดิม","กระทงในอดีตทำจากวัสดุธรรมชาติ ทั้งใบตอง กาบกล้วย และดอกไม้ ประดับธูปเทียน เมื่อลอยไปก็ย่อยสลายกลับคืนสู่ผืนน้ำ",["#0a1a1a","#2a5a4a"]],
["ยุคสมัยใหม่","ต่อมากระทงโฟมแพร่หลายและกลายเป็นปัญหาขยะ ผู้คนจึงรณรงค์ให้กลับมาใช้กระทงจากวัสดุธรรมชาติที่ย่อยสลายได้",["#14122e","#4a3a6a"]],
["ปัจจุบัน","ปัจจุบัน ทางภาคเหนือมีประเพณียี่เป็ง ปล่อยโคมลอยสว่างไสวเต็มท้องฟ้า ส่วนทั่วประเทศก็จัดงานลอยกระทงอย่างงดงาม",["#0b0a2e","#6a3a6a"]],
["พ.ศ. 2569","คืนวันเพ็ญเดือนสิบสอง พ.ศ. 2569 ขอให้เราลอยกระทงอย่างรู้คุณสายน้ำ รักษาประเพณีไทย และรักษาแม่น้ำของเราไปด้วยกัน",["#0b0a2e","#3a2a5c"]]
];
var N="http://www.w3.org/2000/svg",$=function(i){return document.getElementById(i)};
// stars, waves, krathongs
var st="";for(var i=0;i<60;i++)st+='<circle cx="'+(Math.random()*960|0)+'" cy="'+(Math.random()*300|0)+'" r="'+(Math.random()*1.6+.4).toFixed(1)+'"/>';$("stars").innerHTML=st;
function wave(y,a){var p="M-200 "+y;for(var i=0;i<14;i++)p+=" q50 "+(i%2?a:-a)+" 100 0";return '<path d="'+p+'"/>'}
$("wv1").innerHTML=wave(395,-12)+wave(440,-14)+wave(490,-12);$("wv2").innerHTML=wave(415,10)+wave(465,12);
var kh="";[[120,410],[250,450],[380,400],[520,470],[640,420],[880,455],[60,500],[760,500]].forEach(function(p,i){kh+='<g transform="translate('+p[0]+' '+p[1]+')"><g class="bob" style="animation-delay:-'+i*.7+'s"><use href="#kt"/></g></g>'});$("kts").innerHTML=kh;$("kts").style.transition="opacity 1.5s";
// state
var el=0,play=false,started=false,muted=false,cur=-1,last=0,voice=null;
function pick(){var v=speechSynthesis.getVoices();voice=v.filter(function(x){return /^th/i.test(x.lang)})[0]||null}
if("speechSynthesis" in window){pick();speechSynthesis.onvoiceschanged=pick}
function say(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();if(muted||!play)return;var u=new SpeechSynthesisUtterance(t);u.lang="th-TH";if(voice)u.voice=voice;u.rate=.95;speechSynthesis.speak(u)}
function show(i){
 cur=i;for(var k=0;k<9;k++){var g=$("s"+k);if(g)g.classList.toggle("on",k===i)}
 $("era").textContent=S[i][0];$("cap").textContent=S[i][1];
 $("g1").setAttribute("stop-color",S[i][2][0]);$("g2").setAttribute("stop-color",S[i][2][1]);
 $("kts").style.opacity=i===0?0:1;$("moon").setAttribute("r",i===8?58:42);
 say(S[i][1]);
}
function burst(){var g=document.createElementNS(N,"g");var x=100+Math.random()*760,y=60+Math.random()*180,c=["#ffd36a","#ff7ab0","#7ad0ff","#9aff9a"][Math.random()*4|0];
 for(var i=0;i<14;i++){var a=i/14*6.283,l=document.createElementNS(N,"line");l.setAttribute("x1",x);l.setAttribute("y1",y);l.setAttribute("x2",x+Math.cos(a)*50);l.setAttribute("y2",y+Math.sin(a)*50);l.setAttribute("stroke",c);l.setAttribute("stroke-width",3);l.setAttribute("stroke-linecap","round");g.appendChild(l)}
 g.setAttribute("class","fw");$("fwg").appendChild(g);setTimeout(function(){g.remove()},1900)}
function lantern(){var e=document.createElementNS(N,"ellipse");e.setAttribute("cx",60+Math.random()*840);e.setAttribute("cy",380);e.setAttribute("rx",9);e.setAttribute("ry",13);e.setAttribute("fill","#ffb02e");e.setAttribute("class","ln");$("lng").appendChild(e);setTimeout(function(){e.remove()},9100)}
setInterval(function(){if(!play)return;if(cur===3||cur===7||cur===8)burst();if(cur===7||cur===8||cur===0&&0)lantern()},700);
function fmt(s){s=s|0;return(s/60|0)+":"+("0"+s%60).slice(-2)}
function tick(t){
 if(play){el+=(t-last)/1000;if(el>=D*9){el=D*9;play=false;$("pp").textContent="↻";if("speechSynthesis" in window)speechSynthesis.cancel()}
  var i=Math.min(8,el/D|0);if(i!==cur)show(i)}
 last=t;$("prog").firstChild.style.width=(el/(D*9)*100)+"%";$("tm").textContent=fmt(el)+" / 3:00";requestAnimationFrame(tick)}
function begin(){$("intro").style.display="none";started=true;play=true;el=0;cur=-1;$("pp").textContent="⏸";
 if(!voice&&"speechSynthesis" in window)pick();
 $("note").textContent=voice?"":"อุปกรณ์นี้อาจไม่มีเสียงภาษาไทย จึงแสดงคำบรรยายเป็นตัวอักษรแทน (ลองใช้ Chrome, Edge หรือ Safari)"}
$("go").onclick=begin;
$("pp").onclick=function(){if(!started)return begin();if(el>=D*9){el=0;cur=-1;play=true;$("pp").textContent="⏸";return}
 play=!play;$("pp").textContent=play?"⏸":"▶";if(play)say(S[cur][1]);else if("speechSynthesis" in window)speechSynthesis.cancel()};
$("mu").onclick=function(){muted=!muted;$("mu").textContent=muted?"🔇":"🔊";if(muted){if("speechSynthesis" in window)speechSynthesis.cancel()}else if(play&&cur>=0)say(S[cur][1])};
$("cap").textContent="";$("era").textContent="";$("s0").classList.add("on");
requestAnimationFrame(function(t){last=t;requestAnimationFrame(tick)});
</script>
</body>
</html>
